<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STADIUM ATLAS · 豪门主场地图集</title>
<meta name="description" content="把世界足坛豪门的主场放上地图：33 座传奇球场的容量、年代与故事，一张可交互的可视化地图集。">
<link rel="stylesheet" href="assets/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230b0e13' stroke='%23d7ff3f' stroke-width='2'/%3E%3Cpath d='M3 16h26M16 3v26' stroke='%23d7ff3f' stroke-width='1.2' opacity='.5'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='none' stroke='%23d7ff3f' stroke-width='1.6'/%3E%3C/svg%3E">
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-opacity=".25"/>
        <circle cx="20" cy="20" r="12.5" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-dasharray="3 3"/>
        <circle cx="20" cy="20" r="4" fill="var(--accent)"/>
        <circle cx="20" cy="20" r="8.5" fill="none" stroke="var(--accent)" stroke-opacity=".35"/>
      </svg>
      <div class="brand-text">
        <h1>STADIUM <em>ATLAS</em></h1>
        <p class="brand-sub">全球豪门主场可视化 <span class="sep">·</span> <span id="stat-count">33</span> 座球场</p>
      </div>
    </div>
    <div class="top-stats">
      <div class="tstat"><span class="tstat-v" id="stat-total">–</span><span class="tstat-k">总容量（席）</span></div>
      <div class="tstat"><span class="tstat-v" id="stat-avg">–</span><span class="tstat-k">平均容量</span></div>
      <div class="tstat"><span class="tstat-v" id="stat-big">–</span><span class="tstat-k">最大球场</span></div>
      <div class="tstat"><span class="tstat-v" id="stat-old">–</span><span class="tstat-k">最古老</span></div>
    </div>
  </header>

  <main class="layout">

    <aside class="rail">
      <div class="search-wrap">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="搜索俱乐部 / 球场 / 城市…" autocomplete="off" spellcheck="false">
        <button class="clear-btn" id="clear-search" title="清空" hidden>✕</button>
      </div>

      <div class="chips" id="league-chips"></div>

      <div class="slider-wrap">
        <div class="slider-head">
          <label for="cap-slider">容量下限</label>
          <output id="cap-value">≥ 40,000</output>
        </div>
        <input id="cap-slider" type="range" min="40000" max="85000" step="1000" value="40000">
      </div>

      <div class="list-head">
        <span>按容量排序</span>
        <span class="list-count" id="list-count"></span>
      </div>
      <ol class="club-list" id="club-list"></ol>

      <footer class="rail-foot">
        容量与年代为公开资料整理的近似值（2025）· 地图数据 © world-atlas / Natural Earth
      </footer>
    </aside>

    <section class="stage">
      <div class="map-wrap" id="map-wrap">
        <svg id="map" preserveAspectRatio="xMidYMid meet" aria-label="世界球场分布地图">
          <defs>
            <radialGradient id="sea" cx="50%" cy="42%" r="75%">
              <stop offset="0%" stop-color="#0d1420"/>
              <stop offset="100%" stop-color="#080b11"/>
            </radialGradient>
            <linearGradient id="land-fill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#1a212c"/>
              <stop offset="100%" stop-color="#141a23"/>
            </linearGradient>
            <filter id="marker-glow" x="-120%" y="-120%" width="340%" height="340%">
              <feGaussianBlur stdDeviation="3.2" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <rect id="sea" x="0" y="0" width="100%" height="100%" fill="url(#sea)"/>
          <g id="viewport">
            <g id="graticule"></g>
            <g id="land"></g>
            <g id="markers"></g>
          </g>
        </svg>

        <div class="map-title">
          <span class="map-title-main" id="map-title-text">世界视图</span>
          <span class="map-title-sub" id="map-title-sub">滚轮缩放 · 拖拽平移 · 点击标记查看详情</span>
        </div>

        <div class="legend" id="legend">
          <div class="legend-row" id="legend-leagues"></div>
          <div class="legend-row legend-size">
            <span class="ls-dot s1"></span><span>4 万</span>
            <span class="ls-dot s2"></span><span>6 万</span>
            <span class="ls-dot s3"></span><span>8 万+</span>
            <span class="legend-cap">标记大小 = 容量</span>
          </div>
        </div>

        <div class="zoom-ctrl">
          <button id="zoom-in" title="放大">+</button>
          <button id="zoom-out" title="缩小">−</button>
          <span class="zoom-level" id="zoom-level">1.0×</span>
          <div class="preset-row" id="preset-row">
            <button data-view="world" class="on">全球</button>
            <button data-view="europe">欧洲</button>
            <button data-view="britain">英伦</button>
            <button data-view="sa">南美</button>
          </div>
        </div>

        <div class="tooltip" id="tooltip" hidden></div>
      </div>

      <aside class="detail" id="detail" hidden>
        <button class="detail-close" id="detail-close" title="关闭 (Esc)">✕</button>
        <div class="detail-body" id="detail-body"></div>
        <div class="detail-nav">
          <button id="prev-btn">← 上一座</button>
          <span class="detail-pos" id="detail-pos"></span>
          <button id="next-btn">下一座 →</button>
        </div>
      </aside>
    </section>

  </main>
</div>

<script src="assets/vendor/three.min.js"></script>
<script src="assets/world.js"></script>
<script src="assets/data.js"></script>
<script src="assets/images.js"></script>
<script src="assets/crests.js"></script>
<script src="assets/panos.js"></script>
<script src="assets/gallery.js"></script>
<script src="assets/stadium3d.js"></script>
<script src="assets/panoview.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
